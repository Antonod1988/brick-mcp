[project]
name = "brick-mcp"
version = "0.2.0"
description = "MCP server for creating and editing BrickLink Studio LEGO models"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3.1.0",
    "numpy>=2.4,<3",
    "pillow>=12,<13",
    "pyzipper>=0.3.6",
]

[project.scripts]
brick-mcp = "brick_mcp:mcp.run"

[tool.uv.sources]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "black>=26.3.0",
    "isort>=8.0.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["brick_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
omit = ["tests/*"]

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]

[tool.black]
line-length = 88
target-version = ["py314"]
